<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>敬愛大学 オープンキャンパス｜キャンパス・フォトブース</title>
<meta name="description" content="スマホのカメラで撮影して、敬愛大学のキャンパスを背景にした1枚をその場で作れます。">
<meta name="theme-color" content="#0E1621">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1621;
  --crimson:#B21E28;
  --crimson-deep:#7E1119;
  --glass:#7FB2D9;
  --pale:#F2F4F7;
  --line:rgba(14,22,33,.14);
  --disp:"Shippori Mincho B1",serif;
  --body:"Zen Kaku Gothic New",system-ui,sans-serif;
  --mono:"Roboto Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body);
  color:var(--ink);
  background:var(--pale);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:920px;margin:0 auto;padding:0 20px 80px}

/* ---------- louver header ---------- */
header.hero{
  position:relative;
  background:var(--ink);
  color:#fff;
  overflow:hidden;
  padding:clamp(30px,7vw,64px) 20px clamp(26px,6vw,54px);
}
.louvers{position:absolute;inset:0;pointer-events:none}
.louvers svg{width:100%;height:100%;display:block}
.hero-in{position:relative;max-width:920px;margin:0 auto}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;
  color:var(--glass);margin:0 0 14px;text-transform:uppercase;
}
h1{
  font-family:var(--disp);font-weight:800;
  font-size:clamp(30px,7.6vw,54px);line-height:1.18;margin:0;
  letter-spacing:.01em;
}
h1 .rule{
  display:block;width:56px;height:3px;background:var(--crimson);
  margin:18px 0 0;
}
.lede{
  margin:18px 0 0;max-width:34em;font-size:15px;line-height:1.85;
  color:rgba(255,255,255,.76);
}

/* ---------- shared section ---------- */
section{margin-top:clamp(34px,6vw,58px)}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.sec-head h2{
  font-family:var(--disp);font-weight:600;font-size:19px;margin:0;letter-spacing:.03em;
}
.sec-head .tag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:#7A8595;
}

/* ---------- stage ---------- */
.stage{
  position:relative;width:100%;aspect-ratio:4/5;max-height:70vh;
  background:#0B1119;border-radius:4px;overflow:hidden;
  display:grid;place-items:center;
  box-shadow:0 18px 50px -22px rgba(14,22,33,.55);
}
.stage video,.stage canvas.preview{
  width:100%;height:100%;object-fit:cover;display:block;
}
.stage video{transform:scaleX(-1)}
.stage video.rear{transform:none}
.stage .idle{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  color:rgba(255,255,255,.62);font-size:13.5px;line-height:2;padding:24px;
}
.stage .idle b{display:block;font-family:var(--disp);font-size:17px;color:#fff;margin-bottom:6px;font-weight:600}

/* louver shutter */
.shutter{position:absolute;inset:0;pointer-events:none;display:none}
.shutter.on{display:block}
.shutter i{
  position:absolute;left:-2%;width:104%;height:calc(100%/9 + 1px);background:#fff;
  transform:scaleY(0);transform-origin:center;
}
.shutter.fire i{animation:louver .5s cubic-bezier(.5,0,.2,1) forwards}
@keyframes louver{0%{transform:scaleY(0)}45%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.count{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--disp);font-weight:800;font-size:clamp(72px,22vw,150px);
  color:#fff;text-shadow:0 6px 40px rgba(0,0,0,.45);pointer-events:none;
}

/* ---------- controls ---------- */
.bar{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{
  font-family:var(--body);font-weight:500;font-size:14px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  padding:13px 18px;border-radius:2px;cursor:pointer;
  transition:background .16s,color .16s,border-color .16s;
}
button:hover:not(:disabled){background:var(--ink);color:#fff;border-color:var(--ink)}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--crimson);outline-offset:2px}
button.primary{
  background:var(--crimson);color:#fff;border-color:var(--crimson);flex:1 1 190px;
  font-weight:700;letter-spacing:.04em;
}
button.primary:hover:not(:disabled){background:var(--crimson-deep);border-color:var(--crimson-deep)}

/* ---------- pickers ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.thumb{
  position:relative;aspect-ratio:4/3;border:1px solid var(--line);background:#fff;
  padding:0;overflow:hidden;border-radius:2px;cursor:pointer;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.thumb:hover img{transform:scale(1.05)}
.thumb span{
  position:absolute;left:0;right:0;bottom:0;padding:5px 7px;
  font-size:10.5px;line-height:1.35;color:#fff;text-align:left;
  background:linear-gradient(transparent,rgba(11,17,25,.86));
}
.thumb[aria-pressed="true"]{outline:3px solid var(--crimson);outline-offset:-3px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  font-size:13px;padding:9px 15px;border:1px solid var(--line);background:#fff;
  border-radius:99px;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.field{margin-top:12px}
.field label{display:block;font-size:11.5px;letter-spacing:.1em;color:#7A8595;margin-bottom:7px;font-family:var(--mono)}
.field input{
  width:100%;font-family:var(--body);font-size:15px;padding:12px 14px;
  border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink);
}
.field input:focus{outline:2px solid var(--crimson);outline-offset:-1px}

.note{font-size:12.5px;line-height:1.9;color:#6B7686;margin:12px 0 0}
.note a{color:var(--crimson)}
.err{
  display:none;margin-top:12px;padding:13px 15px;border-left:3px solid var(--crimson);
  background:#fff;font-size:13px;line-height:1.8;
}
.err.on{display:block}
footer{
  margin-top:60px;padding-top:22px;border-top:1px solid var(--line);
  font-size:11.5px;color:#7A8595;line-height:1.9;
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<header class="hero">
  <div class="louvers" aria-hidden="true">
    <svg viewBox="0 0 1200 420" preserveAspectRatio="none">
      <g fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="16">
        <path d="M-20 40 C 200 8, 420 78, 640 44 S 1060 6, 1220 52"/>
        <path d="M-20 110 C 210 76, 430 148, 650 112 S 1070 74, 1220 122"/>
        <path d="M-20 180 C 200 148, 440 218, 660 182 S 1080 144, 1220 192"/>
        <path d="M-20 250 C 220 218, 430 288, 650 252 S 1070 214, 1220 262"/>
        <path d="M-20 320 C 200 288, 440 358, 660 322 S 1080 284, 1220 332"/>
        <path d="M-20 390 C 220 358, 430 428, 650 392 S 1070 354, 1220 402"/>
      </g>
    </svg>
  </div>
  <div class="hero-in">
    <p class="eyebrow">Keiai University / Open Campus</p>
    <h1>キャンパスを、<br>持って帰る。<span class="rule"></span></h1>
    <p class="lede">スマホのカメラで撮って、敬愛大学の教室・ラウンジ・新校舎を背景に合成した1枚をその場で作れます。保存もシェアもワンタップ。</p>
  </div>
</header>

<div class="wrap">

  <section>
    <div class="sec-head"><h2>撮る</h2><span class="tag">STUDIO</span></div>
    <div class="stage">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="preview" class="preview" hidden></canvas>
      <div class="idle" id="idle">
        <div><b>カメラはまだオフです</b>「カメラを起動」を押すと<br>この画面にプレビューが出ます</div>
      </div>
      <div class="shutter" id="shutter" aria-hidden="true"></div>
      <div class="count" id="count" hidden></div>
    </div>

    <div class="bar">
      <button class="primary" id="btnStart">カメラを起動</button>
      <button id="btnShoot" disabled>3秒後に撮影</button>
      <button id="btnFlip" disabled>内 / 外カメラ</button>
      <button id="btnRetake" hidden>撮り直す</button>
    </div>

    <div class="bar" id="saveBar" hidden>
      <button class="primary" id="btnSave">写真を保存</button>
      <button id="btnShare">シェアする</button>
    </div>

    <div class="err" id="err"></div>
    <p class="note">カメラが開かないときは <input type="file" accept="image/*" capture="user" id="filePick" style="font-size:12px"> からも読み込めます。</p>
  </section>

  <section>
    <div class="sec-head"><h2>背景を選ぶ</h2><span class="tag">CAMPUS</span></div>
    <div class="grid" id="bgGrid"></div>
  </section>

  <section>
    <div class="sec-head"><h2>仕上げる</h2><span class="tag">LAYOUT / TONE</span></div>
    <div class="chips" id="layoutChips" style="margin-bottom:10px"></div>
    <div class="chips" id="toneChips"></div>
    <div class="field">
      <label for="caption">写真に入れる一言</label>
      <input id="caption" maxlength="24" value="#敬愛大生になる日" placeholder="例）#敬愛大生になる日">
    </div>
  </section>

  <footer>
    撮影した画像はすべて端末内で処理されます。サーバーには送信も保存もされません。<br>
    敬愛大学 オープンキャンパス｜千葉県千葉市稲毛区長沼町583
  </footer>
</div>

<script>
const OUT_W = 1080, OUT_H = 1350;

const BACKGROUNDS = [
  {f:"images/campus3.jpg", n:"新校舎 外観"},
  {f:"images/campus1.jpg", n:"アクティブラーニング教室"},
  {f:"images/campus2.jpg", n:"グループワークルーム"},
  {f:"images/campus5.jpg", n:"ラーニングコモンズ"},
  {f:"images/campus7.jpg", n:"学生ラウンジ"},
  {f:"images/campus8.jpg", n:"カフェテリア"},
  {f:"images/campus6.jpg", n:"セミナールーム"},
  {f:"images/campus4.jpg", n:"キャンパス全景"}
];
const LAYOUTS = [
  {id:"round", n:"丸窓"},
  {id:"split", n:"上下2分割"},
  {id:"full",  n:"全面＋フレーム"}
];
const TONES = [
  {id:"natural", n:"ナチュラル", css:"saturate(1.03) contrast(1.02)"},
  {id:"high",    n:"ハイキー",   css:"brightness(1.13) contrast(.94) saturate(1.06)"},
  {id:"film",    n:"フィルム",   css:"contrast(1.12) saturate(.86) sepia(.16)"}
];

let state = {bg:0, layout:"round", tone:"natural", facing:"user", stream:null, shot:null};

const $ = id => document.getElementById(id);
const video=$("video"), preview=$("preview"), idle=$("idle"),
      shutter=$("shutter"), count=$("count"), err=$("err");

/* ---- build pickers ---- */
$("bgGrid").innerHTML = BACKGROUNDS.map((b,i)=>
  `<button class="thumb" data-i="${i}" aria-pressed="${i===0}"><img src="${b.f}" alt="${b.n}" loading="lazy"><span>${b.n}</span></button>`).join("");
$("layoutChips").innerHTML = LAYOUTS.map(l=>
  `<button class="chip" data-l="${l.id}" aria-pressed="${l.id==='round'}">${l.n}</button>`).join("");
$("toneChips").innerHTML = TONES.map(t=>
  `<button class="chip" data-t="${t.id}" aria-pressed="${t.id==='natural'}">${t.n}</button>`).join("");
shutter.innerHTML = Array.from({length:9},(_,i)=>`<i style="top:${i*11.2}%"></i>`).join("");

function bind(sel, attr, key){
  document.querySelectorAll(sel).forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(sel).forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    state[key] = attr==="i" ? +b.dataset.i : b.dataset[attr];
    if(state.shot) compose();
  }));
}
bind(".thumb","i","bg"); bind("[data-l]","l","layout"); bind("[data-t]","t","tone");
$("caption").addEventListener("input",()=>{ if(state.shot) compose(); });

/* ---- camera ---- */
function showErr(msg){ err.textContent = msg; err.classList.add("on"); }

async function startCamera(){
  err.classList.remove("on");
  if(!navigator.mediaDevices?.getUserMedia){
    showErr("このブラウザではカメラを直接開けません。下の「ファイル選択」からカメラで撮影してください。"); return;
  }
  try{
    if(state.stream) state.stream.getTracks().forEach(t=>t.stop());
    state.stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:state.facing, width:{ideal:1440}, height:{ideal:1920}}, audio:false
    });
    video.srcObject = state.stream;
    video.classList.toggle("rear", state.facing!=="user");
    await video.play();
    idle.hidden = true; preview.hidden = true; video.hidden = false;
    $("btnShoot").disabled = false; $("btnFlip").disabled = false;
    $("btnStart").textContent = "カメラを再起動";
  }catch(e){
    showErr("カメラを開けませんでした（"+e.name+"）。ブラウザ設定でカメラを許可するか、下の「ファイル選択」から撮影してください。");
  }
}

$("btnStart").onclick = startCamera;
$("btnFlip").onclick = ()=>{ state.facing = state.facing==="user" ? "environment" : "user"; startCamera(); };

/* ---- countdown + capture ---- */
$("btnShoot").onclick = async ()=>{
  $("btnShoot").disabled = true;
  count.hidden = false;
  for(const n of [3,2,1]){ count.textContent = n; await sleep(750); }
  count.hidden = true;
  shutter.classList.add("on","fire");
  await sleep(240);
  grabFrame();
  await sleep(300);
  shutter.classList.remove("on","fire");
};

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function grabFrame(){
  const c = document.createElement("canvas");
  c.width = video.videoWidth; c.height = video.videoHeight;
  const x = c.getContext("2d");
  if(state.facing==="user"){ x.translate(c.width,0); x.scale(-1,1); }
  x.drawImage(video,0,0);
  state.shot = c;
  compose();
}

$("filePick").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement("canvas");
    c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext("2d").drawImage(img,0,0);
    state.shot = c; compose(); err.classList.remove("on");
  };
  img.src = URL.createObjectURL(f);
});

/* ---- compose ---- */
const bgCache = {};
function loadBg(src){
  if(bgCache[src]) return Promise.resolve(bgCache[src]);
  return new Promise(res=>{
    const i = new Image();
    i.onload = ()=>{ bgCache[src]=i; res(i); };
    i.onerror = ()=>res(null);
    i.src = src;
  });
}

function cover(ctx, img, dx, dy, dw, dh){
  const iw = img.width||img.naturalWidth, ih = img.height||img.naturalHeight;
  const s = Math.max(dw/iw, dh/ih);
  const w = iw*s, h = ih*s;
  ctx.drawImage(img, dx+(dw-w)/2, dy+(dh-h)/2, w, h);
}

async function compose(){
  if(!state.shot) return;
  preview.width = OUT_W; preview.height = OUT_H;
  const g = preview.getContext("2d");
  const bg = await loadBg(BACKGROUNDS[state.bg].f);
  const tone = TONES.find(t=>t.id===state.tone).css;

  g.clearRect(0,0,OUT_W,OUT_H);
  g.fillStyle = "#0E1621"; g.fillRect(0,0,OUT_W,OUT_H);

  if(state.layout==="full"){
    g.filter = tone; cover(g, state.shot, 0,0,OUT_W,OUT_H); g.filter="none";
    g.fillStyle = "rgba(14,22,33,.30)"; g.fillRect(0,OUT_H-330,OUT_W,330);
  }else if(state.layout==="split"){
    g.filter = tone; cover(g, state.shot, 0,0,OUT_W,830); g.filter="none";
    if(bg) cover(g, bg, 0,830,OUT_W,OUT_H-830);
    g.fillStyle="rgba(14,22,33,.42)"; g.fillRect(0,OUT_H-250,OUT_W,250);
    g.fillStyle="#B21E28"; g.fillRect(0,824,OUT_W,6);
  }else{ // round
    if(bg){ g.filter="brightness(.94)"; cover(g,bg,0,0,OUT_W,OUT_H); g.filter="none"; }
    g.fillStyle="rgba(14,22,33,.34)"; g.fillRect(0,0,OUT_W,OUT_H);
    const cx=540, cy=580, r=356;
    g.save();
    g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.closePath(); g.clip();
    g.filter = tone; cover(g, state.shot, cx-r, cy-r, r*2, r*2); g.filter="none";
    g.restore();
    g.strokeStyle="#fff"; g.lineWidth=14;
    g.beginPath(); g.arc(cx,cy,r+7,0,Math.PI*2); g.stroke();
    g.strokeStyle="#B21E28"; g.lineWidth=4;
    g.beginPath(); g.arc(cx,cy,r+22,0,Math.PI*2); g.stroke();
  }

  drawLouvers(g);
  drawPlate(g);

  preview.hidden = false; video.hidden = true; idle.hidden = true;
  $("btnRetake").hidden = false; $("saveBar").hidden = false;
  $("btnShoot").disabled = !state.stream;
}

/* signature: the building's wavy louver bands */
function drawLouvers(g){
  g.save();
  g.globalCompositeOperation = "overlay";
  g.strokeStyle = "rgba(255,255,255,.30)"; g.lineWidth = 22;
  for(let i=0;i<7;i++){
    const y = 70 + i*118;
    g.beginPath();
    for(let x=-40;x<=OUT_W+40;x+=12){
      const yy = y + 26*Math.sin(x/210 + i*1.15);
      x===-40 ? g.moveTo(x,yy) : g.lineTo(x,yy);
    }
    g.stroke();
  }
  g.restore();
}

function drawPlate(g){
  const cap = ($("caption").value||"").trim();
  const d = new Date();
  const stamp = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
  const baseY = OUT_H - 150;

  g.fillStyle = "#B21E28";
  g.fillRect(72, baseY - 96, 5, 62);

  g.textBaseline = "alphabetic";
  g.fillStyle = "#fff";
  g.font = '800 46px "Shippori Mincho B1", serif';
  g.fillText("敬愛大学", 96, baseY - 48);

  g.fillStyle = "rgba(255,255,255,.82)";
  g.font = '500 21px "Roboto Mono", monospace';
  g.fillText("OPEN CAMPUS", 96, baseY - 12);

  g.fillStyle = "rgba(255,255,255,.62)";
  g.font = '400 20px "Roboto Mono", monospace';
  const w = g.measureText(stamp).width;
  g.fillText(stamp, OUT_W - 72 - w, baseY - 12);

  if(cap){
    g.fillStyle = "#fff";
    g.font = '700 34px "Zen Kaku Gothic New", sans-serif';
    g.fillText(cap, 96, baseY + 42);
  }

  g.fillStyle = "rgba(255,255,255,.45)";
  g.font = '400 17px "Roboto Mono", monospace';
  const loc = BACKGROUNDS[state.bg].n;
  const lw = g.measureText(loc).width;
  g.fillText(loc, OUT_W - 72 - lw, baseY + 40);
}

/* ---- retake / save / share ---- */
$("btnRetake").onclick = ()=>{
  state.shot = null;
  preview.hidden = true; $("btnRetake").hidden = true; $("saveBar").hidden = true;
  if(state.stream){ video.hidden = false; } else { idle.hidden = false; }
};

function toBlob(){ return new Promise(r=>preview.toBlob(r,"image/jpeg",.92)); }

$("btnSave").onclick = async ()=>{
  const b = await toBlob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = `keiai-opencampus-${Date.now()}.jpg`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
};

$("btnShare").onclick = async ()=>{
  const b = await toBlob();
  const file = new File([b], "keiai-opencampus.jpg", {type:"image/jpeg"});
  if(navigator.canShare?.({files:[file]})){
    try{ await navigator.share({files:[file], text:"敬愛大学 オープンキャンパス #敬愛大学"}); }catch(e){}
  }else{
    showErr("このブラウザは直接シェアに対応していません。「写真を保存」してから投稿してください。");
  }
};

/* stop camera when tab hidden */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden && state.stream){ state.stream.getTracks().forEach(t=>t.stop()); state.stream=null;
    $("btnShoot").disabled=true; $("btnFlip").disabled=true; }
});
</script>
</body>
</html>
